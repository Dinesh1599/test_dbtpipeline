version: 2

models:
  - name: fct_freq_by_attributes
    description: "Exhibit 1 — frequency by policy attributes (policy-term grain)."
    columns:
      - name: pol_pk
        description: "Policy-term key."
        tests:
          - not_null
      - name: ee_total
        description: "Total earned exposure for the term."

  - name: fct_freq_lr_by_accqtr
    description: "Exhibit 2 — frequency & loss ratio by accident quarter (POL_PK x YYYYQT)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [pol_pk, yyyyqt]
    columns:
      - name: pol_pk
        tests:
          - not_null
      - name: yyyyqt
        description: "Accident quarter as year*100 + quarter (e.g. 201903)."
        tests:
          - not_null
